name: Build & Publish Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME:-debug}"
          mkdir -p renamed
          cp app/build/outputs/apk/debug/app-debug.apk "renamed/Glimmer-${VERSION}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Glimmer-APK
          path: renamed/Glimmer-*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Glimmer ${{ github.ref_name }}"
          body: |
            ## 🎂 Glimmer ${{ github.ref_name }}
            
            Birthday reminder app — dark neumorphic design.
            
            **Install:** Download the APK below and open it on your Android device (allow installation from unknown sources if prompted).
          files: renamed/Glimmer-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
